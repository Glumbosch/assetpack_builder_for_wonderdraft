[package]
name = "wonderdraft-asset-studio"
version = "0.2.0"
edition = "2021"
description = "Native Wonderdraft asset-pack creator and sprite transparency editor"
license = "MIT"



[target.'cfg(target_os = "linux")'.dependencies]
eframe = {
    version = "0.35",
    default-features = false,
    features = [
        "default_fonts",
        "glow",
        "x11"
    ]
}

[target.'cfg(target_os = "windows")'.dependencies]
eframe = {
    version = "0.35",
    default-features = false,
    features = [
        "default_fonts",
        "glow"
    ]
}

[target.'cfg(target_os = "macos")'.dependencies]
eframe = {
    version = "0.35",
    default-features = false,
    features = [
        "default_fonts",
        "glow"
    ]
}
[dependencies]
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
